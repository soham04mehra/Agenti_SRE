name: Agentic SRE CI & Benchmark Suite

on:
  push:
    branches: [ main, audit-and-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run isolated unit test suite
        run: |
          python -m unittest discover tests

      - name: Run development robustness benchmark (18 cases)
        run: |
          python eval/run_benchmark.py --suite dev

      - name: Run frozen holdout robustness benchmark (18 cases)
        run: |
          python eval/run_benchmark.py --suite holdout
